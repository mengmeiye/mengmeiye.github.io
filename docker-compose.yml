# Local preview: run `docker compose up`, then open http://localhost:8080
# After changing Gemfile or Gemfile.lock, run `docker compose up --build`.
services:
  jekyll:
    build: .
    image: mengmeiye-site:local
    ports:
      - "8080:8080"
      - "35729:35729" # live reload
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
