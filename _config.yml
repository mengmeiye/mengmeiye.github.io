# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

first_name: Mengmei
last_name: Ye
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Staff Research Scientist, IBM Research.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
lang: en # the language of your site
url: https://mengmeiye.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root
max_width: 930px

# Widths of the pre-generated WebP copies of images in assets/img/
# (e.g. Mengmei_Ye-480.webp). See README.md for how to regenerate them.
responsive_image_widths: [480, 800, 1400]

# rel/target added to links that point outside the site (_plugins/external-links.rb)
external_links:
  rel: external nofollow noopener
  target: _blank

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

include: ["_pages"]
exclude:
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - UnusedPages/
  - vendor/

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
